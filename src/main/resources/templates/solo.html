<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solo Art - Walid Jahin</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        body {
            margin: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #fff;
            color: #111;
        }

        .hero-section {
            width: 100%;
            padding: 6rem 0;
            /* 6rem top & bottom */
            background-color: #f9f9f9;
            text-align: center;
            font-family: 'Roboto Serif', serif;
            font-size: 3.75rem;
            /* 사용자 요청 */
            font-weight: 800;
            font-style: italic;
            letter-spacing: -0.0625rem;
            color: #111;
        }

        .hero-container {
            max-width: 48rem;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            /* 약 5rem */
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <div class="nav-wrapper">
                <div class="logo">Walid Jahin</div>
                <div class="nav-links">
                    <a th:href="@{/index}">HOME</a>
                    <a th:href="@{/artist}">ARTIST</a>
                    <a th:href="@{/solo}">SOLO ART</a>
                    <a th:href="@{/artwork}">ART WORK</a>
                    <a th:href="@{/artshop}">ART SHOP</a>
                </div>
            </div>
            <div class="lang">
                <div class="gtranslate_wrapper"></div>
                <button id="adminButton"
                    style="background: #f9f9f9; color: black; border: none; padding: .375rem .875rem; border-radius: .25rem; cursor: pointer;">LOGIN</button>
            </div>
        </div>
    </header>

    <script>
        const adminButton = document.getElementById('adminButton');
        function updateAdminButton() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            adminButton.textContent = isAdmin ? 'LOGOUT' : 'LOGIN';
            adminButton.onclick = () => {
                if (isAdmin) {
                    localStorage.removeItem('isAdmin');
                    location.reload();
                } else {
                    location.href = '/admin/login';
                }
            };
        }
        document.addEventListener('DOMContentLoaded', updateAdminButton);
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const igEl = document.getElementById('footerInstagram');
            const fbEl = document.getElementById('footerFacebook');

            try {
                const [igRes, fbRes] = await Promise.all([
                    fetch('/api/social/instagram'),
                    fetch('/api/social/facebook'),
                ]);

                const igUrl = igRes.ok ? (await igRes.text()).trim() : '';
                const fbUrl = fbRes.ok ? (await fbRes.text()).trim() : '';

                if (igEl) {
                    if (igUrl) { igEl.href = igUrl; igEl.style.display = 'inline-flex'; }
                    else igEl.style.display = 'none';
                }
                if (fbEl) {
                    if (fbUrl) { fbEl.href = fbUrl; fbEl.style.display = 'inline-flex'; }
                    else fbEl.style.display = 'none';
                }
            } catch (e) {
                console.error('SNS link load failed:', e);
                if (igEl) igEl.style.display = 'none';
                if (fbEl) fbEl.style.display = 'none';
            }
        });
    </script>

    <section class="hero-section">
        <div class="hero-container">
            <h2 class="hero-title">
                SOLO<br>
                EXHIBITIONS
            </h2>
        </div>
    </section>


    <!-- 솔로 시작 -->



    <!-- (선택) 미리보기 프리로드 -->
    <link rel="preload" as="image" href="/images/placeholder-hero.jpg" />

    <style>
        :root {
            --fg: #111;
            --muted: #6b7280;
            --line: #e5e7eb;
            --chip: #f3f4f6;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Apple SD Gothic Neo, Malgun Gothic, sans-serif;
            color: var(--fg);
            background: #fff;
        }

        /* Hero */
        .solo-hero {
            position: relative;
            width: 100%;
            height: clamp(18rem, 42vw, 36rem);
            background: #000;
            display: grid;
            place-items: center;
            overflow: hidden
        }

        .solo-hero img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .9;
            filter: contrast(1.05) saturate(1.05)
        }

        .solo-hero .veil {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, .35), rgba(0, 0, 0, .25))
        }

        .solo-hero .meta {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #fff;
            padding: 0 1rem
        }

        .solo-hero .title {
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: 800;
            letter-spacing: .02em
        }

        .solo-hero .date {
            margin-top: .25rem;
            font-size: clamp(.9rem, 1.6vw, 1.125rem);
            opacity: .9
        }

        .container {
            max-width: 76rem;
            margin: 0 auto;
            padding: 2rem 1rem
        }

        .section {
            margin-top: 2rem
        }

        .btn {
            appearance: none;
            border: 1px solid var(--fg);
            background: var(--fg);
            color: #fff;
            padding: .625rem 1rem;
            border-radius: .75rem;
            font-weight: 700;
            cursor: pointer
        }

        .btn.ghost {
            background: transparent;
            color: var(--fg)
        }

        /* Modal */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50
        }

        .backdrop.show {
            display: flex
        }

        .modal {
            width: min(64rem, 92vw);
            max-height: 88vh;
            background: #fff;
            border-radius: .75rem;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
            display: flex;
            flex-direction: column
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1rem .75rem;
            border-bottom: 1px solid var(--line)
        }

        .modal-title {
            margin: 0;
            font-size: 1.125rem;
            font-weight: 800
        }

        .modal-close {
            appearance: none;
            border: none;
            background: transparent;
            font-size: 1.5rem;
            cursor: pointer
        }

        .modal-body {
            padding: 1rem;
            overflow: auto
        }

        /* Intro + Gallery */
        .intro {
            background: var(--chip);
            border: 1px solid var(--line);
            border-radius: .5rem;
            padding: 1rem;
            white-space: pre-wrap;
            color: #222
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem
        }

        .g-item {
            border: 1px solid var(--line);
            border-radius: .5rem;
            overflow: hidden;
            background: #fff
        }

        .g-thumb {
            width: 100%;
            aspect-ratio: 4/3;
            display: block;
            object-fit: cover
        }

        .g-caption {
            padding: .5rem .75rem;
            font-size: .9375rem
        }

        @media (max-width:900px) {
            .gallery {
                grid-template-columns: 1fr 1fr
            }
        }

        @media (max-width:520px) {
            .gallery {
                grid-template-columns: 1fr
            }
        }

        /* Skeleton */
        .skeleton {
            position: relative;
            overflow: hidden;
            background: #f3f4f6
        }

        .skeleton::after {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .5), transparent);
            animation: shimmer 1.2s infinite;
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%)
            }
        }

        .muted {
            color: var(--muted)
        }
    </style>

    <!-- sanitize (defer: DOMContentLoaded 전에 실행됨) -->
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    </head>

    <body data-default-title="">
        <!-- Hero -->
        <header class="solo-hero" aria-label="Solo exhibition header">
            <img id="heroImg" alt="" src="/images/placeholder-hero.jpg" />
            <div class="veil" aria-hidden="true"></div>
            <div class="meta">
                <h1 id="heroTitle" class="title">Loading…</h1>
                <p id="heroDate" class="date"></p>
                <div style="margin-top:1rem">
                    <button class="btn" id="openModalBtn">미리보기</button>
                    <button class="btn ghost" id="shareBtn" aria-label="링크 복사">공유</button>
                </div>
            </div>
        </header>

        <main class="container">
            <section class="section">
                <p class="muted">* 대시보드에서 등록된 타이틀(ID)의 헤더/모달 데이터를 표시합니다.</p>
            </section>
        </main>

        <!-- Modal -->
        <div class="backdrop" id="backdrop" aria-hidden="true" role="dialog" aria-modal="true">
            <div class="modal" role="document">
                <div class="modal-header">
                    <h3 class="modal-title" id="modalTitle">Loading…</h3>
                    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
                </div>
                <div class="modal-body">
                    <div id="intro" class="intro skeleton"></div>
                    <div id="gallery" class="gallery" aria-live="polite" aria-busy="true" style="margin-top:1rem"></div>
                </div>
            </div>
        </div>

        <script>
            // 모든 DOM + defer 스크립트(=DOMPurify) 로드 이후 실행
            window.addEventListener('DOMContentLoaded', () => {
                const params = new URLSearchParams(location.search);
                const DEFAULT_TITLE = document.body.getAttribute('data-default-title') || '';
                const title = params.get('title') || DEFAULT_TITLE || '';

                const heroImg = document.getElementById('heroImg');
                const heroTitle = document.getElementById('heroTitle');
                const heroDate = document.getElementById('heroDate');
                const openBtn = document.getElementById('openModalBtn');
                const shareBtn = document.getElementById('shareBtn');

                const backdrop = document.getElementById('backdrop');
                const modalClose = document.getElementById('modalClose');
                const modalTitle = document.getElementById('modalTitle');
                const intro = document.getElementById('intro');
                const gallery = document.getElementById('gallery');

                if (!title) {
                    heroTitle.textContent = '타이틀이 없습니다';
                    heroDate.textContent = 'URL에 ?title=YOUR_ID 를 넣어주세요';
                    openBtn.disabled = true;
                    shareBtn.disabled = true;
                    return;
                }

                // ===== API 연결 지점 (주석만) =====
                // [API: HEADER] GET /api/solo/{title}       → { title, date, bgImageUrl }
                // [API: MODAL ] GET /api/solo/{title}/modal → { intro, photos:[{ url, title }] }

                // 안정성 있는 sanitize
                const sanitize = (html) => (window.DOMPurify ? DOMPurify.sanitize(html) : String(html || ''));

                // --- Header 로드 (MOCK) ---
                async function loadHeader() {
                    try {
                        // const res = await fetch(`/api/solo/${encodeURIComponent(title)}`);
                        // const data = await res.json();
                        const data = { title, date: '2025-09-20', bgImageUrl: '' }; // MOCK

                        heroTitle.textContent = data.title || title;
                        heroDate.textContent = data.date || '';
                        if (data.bgImageUrl) heroImg.src = data.bgImageUrl;
                    } catch (e) {
                        heroTitle.textContent = title;
                        heroDate.textContent = '';
                        console.error('HEADER load failed:', e);
                    }
                }

                // --- Modal 로드 (MOCK) ---
                async function loadModal() {
                    try {
                        // const res = await fetch(`/api/solo/${encodeURIComponent(title)}/modal`);
                        // const data = await res.json();
                        const data = {
                            intro: '샘플 설명입니다.\n모달 상단에 표시됩니다.',
                            photos: [
                                { url: '/images/sample1.jpg', title: 'Installation View' },
                                { url: '/images/sample2.jpg', title: 'Painting #1' },
                                { url: '/images/sample3.jpg', title: 'Painting #2' }
                            ]
                        }; // MOCK

                        intro.classList.remove('skeleton');
                        intro.textContent = sanitize(data.intro);

                        gallery.innerHTML = '';
                        const list = Array.isArray(data.photos) ? data.photos : [];
                        if (!list.length) {
                            gallery.innerHTML = '<p class="muted">등록된 이미지가 없습니다.</p>';
                        } else {
                            for (const item of list) {
                                const fig = document.createElement('figure');
                                fig.className = 'g-item';

                                const img = document.createElement('img');
                                img.loading = 'lazy';
                                img.alt = item.title || '';
                                img.src = item.url || '/images/placeholder-hero.jpg';
                                img.className = 'g-thumb';

                                const cap = document.createElement('figcaption');
                                cap.className = 'g-caption';
                                cap.textContent = item.title || '';

                                fig.appendChild(img);
                                fig.appendChild(cap);
                                gallery.appendChild(fig);
                            }
                        }
                        gallery.setAttribute('aria-busy', 'false');
                    } catch (e) {
                        intro.classList.remove('skeleton');
                        intro.textContent = '';
                        gallery.innerHTML = '<p class="muted">데이터를 불러오지 못했습니다.</p>';
                        gallery.setAttribute('aria-busy', 'false');
                        console.error('MODAL load failed:', e);
                    }
                }

                // 공유 버튼
                shareBtn.addEventListener('click', async () => {
                    try {
                        const url = new URL(location.href);
                        url.searchParams.set('title', title);
                        await navigator.clipboard.writeText(url.toString());
                        const prev = shareBtn.textContent;
                        shareBtn.textContent = '복사됨!';
                        setTimeout(() => (shareBtn.textContent = prev), 1200);
                    } catch {
                        alert('클립보드 복사 실패');
                    }
                });

                // 모달 열기/닫기
                const openModal = () => { backdrop.classList.add('show'); backdrop.setAttribute('aria-hidden', 'false'); };
                const closeModal = () => { backdrop.classList.remove('show'); backdrop.setAttribute('aria-hidden', 'true'); };

                openBtn.addEventListener('click', () => { modalTitle.textContent = title; openModal(); });
                modalClose.addEventListener('click', closeModal);
                backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
                window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

                // 초기 로드
                loadHeader();
                loadModal();
            });
        </script>
        <!-- 솔로 끝 -->









        <footer>
            <nav>
                <a th:href="@{/index}">HOME</a>
                <a th:href="@{/privacy}">PRIVACY POLICY</a>
                <a th:href="@{/terms}">TERMS OF USE</a>
                <a th:href="@{/contact}">CONTACT</a>
            </nav>
            <div class="footer-sns">
                <!-- 인스타 -->
                <a id="footerInstagram" href="#" target="_blank" rel="noopener" aria-label="Instagram"
                    style="display:none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path
                            d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zM12 7a5 5 0 1 1 0 10a5 5 0 0 1 0-10zm0 1.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 0 0 0-7zm4.25-.75a.75.75 0 1 1 0 1.5a.75.75 0 0 1 0-1.5z" />
                    </svg>
                </a>

                <!-- 페이스북 -->
                <a id="footerFacebook" href="#" target="_blank" rel="noopener" aria-label="Facebook"
                    style="display:none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path
                            d="M22.675 0h-21.35C.596 0 0 .596 0 1.326v21.348C0 23.404.596 24 1.326 24H12.82v-9.294H9.692V11.41h3.128V8.797c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.794.143v3.24l-1.917.001c-1.504 0-1.794.715-1.794 1.763v2.313h3.587l-.467 3.296h-3.12V24h6.116C23.404 24 24 23.404 24 22.674V1.326C24 .596 23.404 0 22.675 0z" />
                    </svg>
            </div>
            </a>

            <div class="footer-logo">Walid Jahin Art Studio</div>
            <div class="footer-bottom">© 2025 Walid Jahin. All rights reserved</div>
        </footer>





        <script>
            window.gtranslateSettings = {
                "default_language": "en",
                "native_language_names": true,
                "languages": ["en", "ar", "ko"],
                "wrapper_selector": ".gtranslate_wrapper",
                "flag_size": 24,
                "switcher_horizontal_position": "inline"
            };
        </script>
        <script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.4/dist/purify.min.js"></script>
    </body>

</html>
