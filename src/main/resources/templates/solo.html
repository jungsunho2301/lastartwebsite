<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solo Art - Walid Jahin</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        body {
            margin: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f9f9f9;
            color: #111;
        }

        .hero-section {
            width: 100%;
            padding: 6rem 0;
            background-color: #f9f9f9;
            text-align: center;
            font-family: 'Roboto Serif', serif;
            font-size: 3.75rem;
            font-weight: 800;
            font-style: italic;
            letter-spacing: -0.0625rem;
            color: #111;
        }

        .hero-container {
            max-width: 48rem;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 10vw, 6rem);
            /* 최소 3rem(48px), 화면 너비의 10% 비율, 최대 6rem(96px) */
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .font-playfair {
            font-family: 'Playfair Display', serif;
        }

        /* 카드(포스터) 타이틀 버튼 */
        .title-btn {
            /* 모바일~데스크톱까지 부드럽게 커지는 크기 */
            font-size: clamp(1.5rem, 4.2vw, 2rem);
            line-height: 1.1;
            text-underline-offset: 4px;
            letter-spacing: 0.01em;
        }

        /* ========================= 카드 썸네일(그리드) ========================== */
        #grid>* {
            min-height: 40rem;
            display: flex;
            flex-direction: column;
            border-radius: .75rem;
            overflow: hidden;
            box-shadow: 0 .25rem .75rem rgba(0, 0, 0, .08);
            background: #fff;
        }

        #grid>*> :first-child {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #grid>*> :first-child img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 썸네일은 꽉 채우기 */
            display: block;
        }

        /* 상태 라벨 숨김 */
        #metaInfo {
            display: none !important;
        }

        /* ========================= 모달(풀스크린 뷰어) ========================== */
        /* 헤더(타이틀/ESC) 숨김 — 헤더 래퍼에 id="modalHeader" 반드시 존재 */
        #modalHeader {
            display: none !important;
        }

        /* 모달 박스: 화면 전체 사용 */
        #modal .modal-box {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            margin: 0;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            background: #000;
            overflow: hidden;
            /* 스크롤 대신 축소 */
        }

        /* 뷰어: 전체 화면 채움 */
        #viewer {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* ===== 부드러운 슬라이드/페이드 전환 핵심 =====
       - 이미지 두 장을 겹쳐두고(active/inactive) 부드럽게 교차
       - JS에서 src 주입 후 클래스 토글로 트랜지션 발생
    */
        .viewer-layer {
            position: absolute !important;
            inset: 0 !important;
            margin: auto !important;
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain !important;
            display: block !important;
            user-select: none;
            pointer-events: none;
            /* 화살표/배경 클릭에 방해 안 되도록 */
            opacity: 0;
            transform: translateX(1.25rem);
            /* 살짝 오른쪽에서 들어오게 */
            transition: opacity 280ms ease, transform 320ms ease;
            will-change: opacity, transform;
        }

        .viewer-layer.active {
            opacity: 1;
            transform: translateX(0);
            z-index: 2;
        }

        .viewer-layer.inactive {
            opacity: 0;
            transform: translateX(-1.25rem);
            /* 이전 이미지는 살짝 왼쪽으로 사라짐 */
            z-index: 1;
        }

        /* 하단 캡션: 반투명 오버레이(항상 보임) */
        #viewer .caption-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: .6rem .9rem;
            background: rgba(0, 0, 0, .55);
            color: #fff;
            font-size: 1rem;
            line-height: 1.25;
            text-align: center;
            z-index: 5;
            /* 화살표 아래/위는 상관없음 */
        }

        /* 화살표: 좌/우 측면 중앙 고정 */
        #modal .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 3rem;
            height: 3rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, .9);
            color: #111;
            font-size: 2rem;
            font-weight: 800;
            display: grid;
            place-items: center;
            box-shadow: 0 .25rem .75rem rgba(0, 0, 0, .25);
            z-index: 6;
            user-select: none;
        }

        #prevBtn {
            left: 1rem;
        }

        #nextBtn {
            right: 1rem;
        }

        #modal .nav-btn:hover {
            background: #fff;
        }

        #modal .nav-btn:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        /* 안전장치: 모달 내부의 다른 img 전역 규칙 무력화 */
        #modal .modal-box img {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain !important;
            position: static;
        }

        footer {
            margin-top: 3rem;
            /* 본문(#f9f9f9) 배경이 드러나는 여백 */
            background: #111;
            /* 푸터 배경은 유지 */
            color: #fff;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <div class="nav-wrapper">
                <div class="logo">Walid Jahin</div>
                <div class="nav-links">
                    <a th:href="@{/index}">HOME</a>
                    <a th:href="@{/artist}">ARTIST</a>
                    <a th:href="@{/solo}">SOLO ART</a>
                    <a th:href="@{/artwork}">ART WORK</a>
                    <a th:href="@{/artshop}">ART SHOP</a>
                </div>
            </div>
            <div class="lang">
                <div class="gtranslate_wrapper"></div>
                <button id="adminButton"
                    style="background: #f9f9f9; color: black; border: none; padding: .375rem .875rem; border-radius: .25rem; cursor: pointer;">LOGIN</button>
            </div>
        </div>
    </header>

    <script>
        const adminButton = document.getElementById('adminButton');
        function updateAdminButton() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            adminButton.textContent = isAdmin ? 'LOGOUT' : 'LOGIN';
            adminButton.onclick = () => {
                if (isAdmin) {
                    localStorage.removeItem('isAdmin');
                    location.reload();
                } else {
                    location.href = '/admin/login';
                }
            };
        }
        document.addEventListener('DOMContentLoaded', updateAdminButton);
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const igEl = document.getElementById('footerInstagram');
            const fbEl = document.getElementById('footerFacebook');

            try {
                const [igRes, fbRes] = await Promise.all([
                    fetch('/api/social/instagram'),
                    fetch('/api/social/facebook'),
                ]);

                const igUrl = igRes.ok ? (await igRes.text()).trim() : '';
                const fbUrl = fbRes.ok ? (await fbRes.text()).trim() : '';

                if (igEl) {
                    if (igUrl) { igEl.href = igUrl; igEl.style.display = 'inline-flex'; }
                    else igEl.style.display = 'none';
                }
                if (fbEl) {
                    if (fbUrl) { fbEl.href = fbUrl; fbEl.style.display = 'inline-flex'; }
                    else fbEl.style.display = 'none';
                }
            } catch (e) {
                console.error('SNS link load failed:', e);
                if (igEl) igEl.style.display = 'none';
                if (fbEl) fbEl.style.display = 'none';
            }
        });
    </script>

    <section class="hero-section">
        <div class="hero-container">
            <h2 class="hero-title">
                SOLO<br>
                EXHIBITIONS
            </h2>
        </div>
    </section>


    <!-- 솔로 시작 -->
    <main class="max-w-7xl mx-auto px-[1rem] pb-[3rem]">
        <!-- 상단 상태 라벨 -->
        <div class="flex items-center justify-between mb-[1rem]">
            <div class="text-sm text-gray-500" id="metaInfo">Loading…</div>
        </div>

        <!-- 3열 카드 그리드 -->
        <section id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-[1rem]"></section>

        <!-- 바닥 상태 (무한 스크롤 쓴다면 필요하지만 지금은 참고용) -->
        <div id="infiniteSentinel" class="py-[2rem] text-center text-gray-400 text-sm hidden">Loading more…</div>
    </main>

    <!-- 상세 모달 (풀스크린 뷰어 + 좌/우 내비 + 캡션) -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-[1rem]">
        <div class="modal-box bg-white rounded-2xl overflow-hidden flex flex-col w-full max-w-[80rem] h-[90vh]">
            <!-- Header (숨김) -->
            <div id="modalHeader" class="flex items-start justify-between px-[0.75rem] py-[0.5rem] border-b flex-none">
                <h2 id="modalTitle" class="text-[3rem] font-extrabold leading-tight break-words font-playfair"></h2>
                <button id="closeModal"
                    class="ml-[0.5rem] text-[0.9rem] bg-white text-gray-900 px-[0.5rem] py-[0.25rem] rounded-md shadow"
                    title="Escape key to close">
                    Esc
                </button>
            </div>

            <!-- Body: 풀스크린 뷰어 -->
            <div class="flex-1">
                <div id="viewer" class="relative w-full h-full">
                    <!-- 두 레이어로 크로스페이드 -->
                    <img id="viewerImgA" alt="" class="viewer-layer inactive" draggable="false" />
                    <img id="viewerImgB" alt="" class="viewer-layer inactive" draggable="false" />
                    <!-- 좌/우 화살표 -->
                    <button id="prevBtn" class="nav-btn">‹</button>
                    <button id="nextBtn" class="nav-btn">›</button>
                    <!-- 하단 오버레이 캡션 -->
                    <div id="viewerCaption" class="caption-overlay"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- ===== 솔로 페이지 동작 스크립트 (부드러운 슬라이드 전환 포함) ===== -->
    <script>
        /* ========= Solo Exhibitions – Title click => Large Image Viewer ========= */

        /* ---- 상태 ---- */
        const state = { page: 0, size: 12, totalLoaded: 0 };

        /* ---- 유틸 ---- */
        const $ = (s) => document.querySelector(s);
        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        /* ---- DOM 캐시 ---- */
        const grid = $('#grid');
        const metaInfo = $('#metaInfo');
        const modal = $('#modal');
        const closeModalBtn = $('#closeModal');
        const modalTitle = $('#modalTitle');

        // 뷰어 관련(더블 버퍼링용 이미지 두 장)
        const layerA = $('#viewerImgA');
        const layerB = $('#viewerImgB');
        const viewerCaption = $('#viewerCaption');
        const prevBtn = $('#prevBtn');
        const nextBtn = $('#nextBtn');

        /* ---- 슬라이드 상태 ---- */
        let currentArts = [];
        let currentIdx = 0;
        let keyHandlerBound = false;
        let activeLayer = 'A'; // 현재 화면에 보이는 레이어 ('A' | 'B')

        /* ==================== 전시 목록 로드 ==================== */
        async function loadExhibitions() {
            if (metaInfo) metaInfo.textContent = 'Loading…';
            try {
                const res = await fetch(`/api/solo/exhibitions?page=${state.page}&size=${state.size}`);
                if (!res.ok) {
                    grid.innerHTML = `<div class="text-gray-500">Failed to load (${res.status}).</div>`;
                    if (metaInfo) metaInfo.textContent = 'Load error.';
                    return;
                }
                const list = await res.json(); // [{id,title,yearMonth,posterImagePath}, ...]
                state.totalLoaded = list.length;
                if (metaInfo) metaInfo.textContent = `Loaded ${state.totalLoaded} item(s)`;
                renderExhibitionGrid(list);
            } catch (e) {
                console.error(e);
                grid.innerHTML = `<div class="text-gray-500">Load error.</div>`;
                if (metaInfo) metaInfo.textContent = 'Load error.';
            }
        }

        /* ==================== 카드 렌더 ==================== */
        function renderExhibitionGrid(list) {
            grid.innerHTML = '';
            if (!list.length) {
                grid.innerHTML = `<div class="text-gray-500">No exhibitions yet.</div>`;
                return;
            }

            list.forEach(x => {
                const card = document.createElement('article');
                card.className = 'rounded-2xl overflow-hidden border bg-white';
                card.innerHTML = `
          <div class="relative w-full h-64 md:h-80 lg:h-96 overflow-hidden">
            <img src="${x.posterImagePath ? escapeHtml(x.posterImagePath) : ''}"
                 alt="${escapeHtml(x.title || '')}"
                 class="absolute inset-0 w-full h-full object-cover" loading="lazy" />
            <div class="absolute inset-0 bg-black bg-opacity-40"></div>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-[1rem]">
              <div class="text-sm md:text-base text-gray-100 mb-[0.25rem]">
                ${escapeHtml(x.yearMonth || '')}
              </div>
              <button class="title-btn text-[1.25rem] md:text-[1.5rem] font-extrabold text-white underline font-playfair"
                      data-id="${x.id}"
                      data-title="${escapeHtml(x.title || '(untitled)')}">
                ${escapeHtml(x.title || '(untitled)')}
              </button>
            </div>
          </div>
        `;

                // 타이틀 클릭 → 첫 번째 사진부터 큰 뷰어로
                card.querySelector('button.title-btn').addEventListener('click', async (ev) => {
                    ev.stopPropagation();
                    const id = Number(ev.currentTarget.getAttribute('data-id'));
                    const title = ev.currentTarget.getAttribute('data-title');
                    await openDetail({ id, title });
                });

                grid.appendChild(card);
            });
        }

        /* ==================== 상세 모달: 첫 사진부터 ==================== */
        async function openDetail(exh) {
            if (!modal || !modalTitle || !layerA || !layerB) return;

            modalTitle.textContent = exh.title || '(untitled)';
            resetLayers(); // 초기화
            viewerCaption.textContent = 'Loading…';
            setNavDisabled(true, true);

            try {
                const res = await fetch(`/api/solo/exhibitions/${exh.id}/arts?page=0&size=200`);
                currentArts = res.ok ? await res.json() : [];
                currentIdx = 0;
                if (!currentArts.length) {
                    viewerCaption.textContent = 'No artworks.';
                } else {
                    showSlide(0, /*direction*/ 0);
                }
            } catch (e) {
                console.error(e);
                viewerCaption.textContent = 'Load error.';
            }

            openModal();
        }

        // 레이어 상태 초기화
        function resetLayers() {
            [layerA, layerB].forEach(l => {
                l.src = '';
                l.alt = '';
                l.classList.remove('active', 'inactive');
                l.classList.add('inactive');
            });
            activeLayer = 'A';
        }

        // 슬라이드 표시 (direction: -1 왼쪽으로, +1 오른쪽으로, 0 초기)
        function showSlide(idx, direction = 0) {
            if (!currentArts.length) return;
            const nextIdx = Math.max(0, Math.min(idx, currentArts.length - 1));
            const a = currentArts[nextIdx] || {};
            const nextSrc = a.imagePath || '';
            const nextAlt = a.title || '';

            viewerCaption.textContent = nextAlt;
            setNavDisabled(nextIdx === 0, nextIdx === currentArts.length - 1);

            // 비활성 레이어에 먼저 로드 → 로드 완료되면 크로스페이드
            const incoming = (activeLayer === 'A') ? layerB : layerA;
            const outgoing = (activeLayer === 'A') ? layerA : layerB;

            incoming.style.transform = 'translateX(0)';
            outgoing.style.transform = 'translateX(0)';


            const img = new Image();
            img.onload = () => {
                // 새 이미지 주입
                incoming.src = nextSrc;
                incoming.alt = nextAlt;

                // 트랜지션 시작: incoming 활성화, outgoing 비활성화
                // 먼저 현재 클래스 정리
                incoming.classList.remove('inactive');
                outgoing.classList.remove('active');

                // 브라우저가 스타일 적용을 인지하도록 한 프레임 쉬고 active 부여
                requestAnimationFrame(() => {
                    // outgoing을 inactive로 만들어 서서히 사라지게
                    outgoing.classList.add('inactive');
                    // incoming을 active로 만들어 서서히 나타나게
                    incoming.classList.add('active');
                });

                // 현재 활성 레이어 스왑
                activeLayer = (activeLayer === 'A') ? 'B' : 'A';

                // 인덱스 갱신
                currentIdx = nextIdx;

                // 프리로드
                preloadAround(currentIdx);
            };
            img.onerror = () => {
                // 이미지 로드 실패 시 캡션만 표시
                incoming.src = '';
                incoming.alt = '';
                viewerCaption.textContent = nextAlt || '(image failed to load)';
                // 인덱스만 갱신
                currentIdx = nextIdx;
                preloadAround(currentIdx);
            };
            img.src = nextSrc;
        }

        function setNavDisabled(disablePrev, disableNext) {
            if (prevBtn) prevBtn.disabled = !!disablePrev;
            if (nextBtn) nextBtn.disabled = !!disableNext;
        }

        function preloadAround(i) {
            [i - 1, i + 1].forEach(k => {
                if (k >= 0 && k < currentArts.length) {
                    const p = new Image();
                    p.src = currentArts[k].imagePath || '';
                }
            });
        }

        /* 좌/우 버튼 */
        prevBtn?.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentIdx > 0) showSlide(currentIdx - 1, -1);
        });
        nextBtn?.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentIdx < currentArts.length - 1) showSlide(currentIdx + 1, +1);
        });

        /* 모달 열고 닫기 */
        function openModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            if (!keyHandlerBound) {
                keyHandlerBound = true;
                window.addEventListener('keydown', onKey);
            }
        }
        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if (keyHandlerBound) {
                keyHandlerBound = false;
                window.removeEventListener('keydown', onKey);
            }
        }
        function onKey(e) {
            if (modal.classList.contains('hidden')) return;
            if (e.key === 'ArrowLeft' && currentIdx > 0) showSlide(currentIdx - 1, -1);
            if (e.key === 'ArrowRight' && currentIdx < currentArts.length - 1) showSlide(currentIdx + 1, +1);
            if (e.key === 'Escape') closeModal();
        }

        closeModalBtn && closeModalBtn.addEventListener('click', closeModal);

        // 배경(모달 바깥 검은 덮개) 클릭 시 닫기
        modal && modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // 사진 이외 영역(뷰어 배경/캡션/여백) 클릭 시 닫기
        const viewerEl = document.getElementById('viewer');
        viewerEl && viewerEl.addEventListener('click', (e) => {
            const t = e.target;
            if (t === layerA || t === layerB || t === prevBtn || t === nextBtn) return; // 이미지/화살표 클릭이면 닫지 않음
            if (t.id === 'viewerCaption' || t.closest('#viewerCaption')) return closeModal();
            if (t === viewerEl) closeModal();
        });

        // 화살표/이미지는 닫기 이벤트 전파 방지
        [prevBtn, nextBtn, layerA, layerB].forEach(el => {
            el && el.addEventListener('click', (e) => e.stopPropagation());
        });

        /* 초기 로드 */
        loadExhibitions();
    </script>
    <!-- ===== 솔로 끝 ===== -->



    <!-- 솔로 끝 -->









    <footer>
        <nav>
            <a th:href="@{/index}">HOME</a>
            <a th:href="@{/privacy}">PRIVACY POLICY</a>
            <a th:href="@{/terms}">TERMS OF USE</a>
            <a th:href="@{/contact}">CONTACT</a>
        </nav>
        <div class="footer-sns">
            <!-- 인스타 -->
            <a id="footerInstagram" href="#" target="_blank" rel="noopener" aria-label="Instagram"
                style="display:none;">
