<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Walid Jahin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fff;
      color: #111;
    }

    header {
      background-color: #f9f9f9;
      padding: 32px 40px;
      border-bottom: 1px solid #e5e5e5;
      position: relative;
    }

    .header-inner {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }

    .nav-links a {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      color: #111;
      border: 1px solid #ccc;
      transition: background-color 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background-color: #f0f0f0;
    }

    .lang {
      position: absolute;
      right: 40px;
      top: 32px;
      font-size: 14px;
      color: #111;
      white-space: nowrap;
    }

    .contact-section {
      max-width: 640px;
      margin: 80px auto;
      padding: 0 20px;
      text-align: center;
    }

    .contact-section h2 {
      font-size: 28px;
      font-weight: 700;
    }

    .contact-section p {
      font-size: 14px;
      color: #555;
      margin-bottom: 40px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
    }

    .contact-form textarea {
      height: 160px;
      resize: none;
    }

    .contact-form button {
      width: 100%;
      padding: 14px;
      background-color: #111;
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .contact-form button:hover {
      background-color: #333;
    }

    footer {
      background-color: #191A1B;
      color: #fff;
      padding: 60px 20px 40px;
      text-align: center;
    }

    footer nav a {
      color: #ccc;
      margin: 0 12px;
      font-size: 14px;
      text-decoration: none;
    }

    footer nav a:hover {
      color: #fff;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 800;
      margin-top: 30px;
    }

    .footer-bottom {
      font-size: 12px;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  
  <!-- Header -->
<header>
  <div class="header-inner">
    <div class="nav-wrapper">
      <div class="logo">Walid Jahin</div>
      <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="artist.html">ARTIST</a>
        <a href="artwork.html">ART WORK</a>
        <a href="artshop.html">ART SHOP</a>
      </div>
    </div>
    <div class="lang">
      ENG▼
      <button id="adminButton" style="margin-left: 20px; background: black; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer;">LOGIN</button>
    </div>
  </div>
</header>

<script>
  const adminButton = document.getElementById('adminButton');

  function updateAdminButton() {
    const isAdmin = localStorage.getItem('isAdmin') === 'true';
    adminButton.textContent = isAdmin ? 'LOGOUT' : 'LOGIN';
    adminButton.onclick = () => {
      if (isAdmin) {
        localStorage.removeItem('isAdmin');
        location.reload(); // 로그아웃 시 새로고침
      } else {
  location.href = '/docs/admin/login.html'; // 로그인 페이지로 이동
      }
    };
  }

  document.addEventListener('DOMContentLoaded', updateAdminButton);
</script>


  <section class="contact-section">
    <h2>작품 구매 문의</h2>
    <p>관심 있는 작품에 대해 문의해 주세요. 작가 또는 운영진이 확인 후 연락을 드립니다.</p>
    <form class="contact-form">
      <input type="text" placeholder="이름" required />
      <input type="email" placeholder="이메일 주소" required />
      <input type="text" placeholder="작품명 또는 문의 제목" required />
      <textarea placeholder="문의 내용을 입력하세요." required></textarea>
      <button type="submit">문의 보내기</button>
    </form>
  </section>

  <footer>
    <nav>
      <a href="index.html">HOME</a>
      <a href="privacy.html">PRIVACY POLICY</a>
      <a href="terms.html">TERMS OF USE</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <div class="footer-logo">Walid Jahin Art Studio</div>
    <div class="footer-bottom">© 2025 Walid Jahin. All rights reserved</div>
  </footer>
</body>
</html>
