<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Work - Walid Jahin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fff;
      color: #111;
    }
    header {
      background-color: #f9f9f9;
      padding: 40px 40px;
      border-bottom: 1px solid #e5e5e5;
      position: relative;
      height: 160px;
    }
    .header-inner {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .nav-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .nav-links {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }
    .nav-links a {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      color: #111;
      border: 1px solid #ccc;
      transition: background-color 0.3s;
    }
    .nav-links a:hover,
    .nav-links a.active {
      background-color: #f0f0f0;
    }
    .lang {
      position: absolute;
      right: 40px;
      top: 32px;
      font-size: 14px;
      color: #111;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lang button {
      background: black;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    footer {
      background-color: #191A1B;
      color: #fff;
      padding: 60px 20px 40px;
      text-align: center;
    }
    footer nav a {
      color: #ccc;
      margin: 0 12px;
      font-size: 14px;
      text-decoration: none;
    }
    footer nav a:hover {
      color: #fff;
    }
    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 800;
      margin-top: 30px;
    }
    .footer-bottom {
      font-size: 12px;
      color: #888;
      margin-top: 20px;
    }
    .sns-icon svg {
      margin-top: 20px;
      transition: fill 0.3s;
      fill: #000;
    }
    .sns-icon svg:hover {
      fill: #fff;
    }
    .artwork-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      padding: 40px;
    }
    .artwork-card {
      border: 1px solid #eee;
      padding: 12px;
      text-align: center;
      transition: box-shadow 0.3s;
      cursor: pointer;
    }
    .artwork-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .artwork-card img {
      max-width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }
    #artwork-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #artwork-modal img {
      max-width: 90%;
      max-height: 90%;
    }
    .modal-content {
      position: relative;
      max-width: 80%;
    }
    .close {
      position: absolute;
      top: -30px;
      right: 0;
      font-size: 36px;
      color: white;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="nav-wrapper">
        <div class="logo">Walid Jahin</div>
        <div class="nav-links">
          <a th:href="@{/index}">HOME</a>
          <a th:href="@{/artist}">ARTIST</a>
          <a th:href="@{/artwork}" class="active">ART WORK</a>
          <a th:href="@{/artshop}">ART SHOP</a>
        </div>
      </div>
      <div class="lang">
        <div class="gtranslate_wrapper"></div>
        <button id="adminButton" style="background: #f9f9f9; color: black; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer;">LOGIN</button>
      </div>
    </div>
  </header>

  <section class="text-center py-16">
    <h2 class="text-4xl font-serif font-semibold mb-2">WALID JAHIN</h2>
    <h2 class="text-3xl font-serif mb-4">ART WORK</h2>
  </section>

  <section id="artwork-grid" class="artwork-container"></section>

  <div id="artwork-modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-modal" class="close">&times;</span>
      <img id="modal-image" src="" alt="Artwork" />
    </div>
  </div>

  <footer>
    <nav>
      <a th:href="@{/index}">HOME</a>
      <a th:href="@{/privacy}">PRIVACY POLICY</a>
      <a th:href="@{/terms}">TERMS OF USE</a>
      <a th:href="@{/contact}">CONTACT</a>
    </nav>
    <div class="sns-icon flex justify-center gap-4 mt-4">
      <a href="https://www.instagram.com/YOUR_INSTAGRAM_ID" target="_blank" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zM12 7a5 5 0 1 1 0 10a5 5 0 0 1 0-10zm0 1.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 0 0 0-7zm4.25-.75a.75.75 0 1 1 0 1.5a.75.75 0 0 1 0-1.5z"/>
        </svg>
      </a>
      <a href="https://www.facebook.com/YOUR_FACEBOOK_ID" target="_blank" aria-label="Facebook">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <path d="M22.675 0h-21.35C.596 0 0 .596 0 1.326v21.348C0 23.404.596 24 1.326 24H12.82v-9.294H9.692V11.41h3.128V8.797c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.794.143v3.24l-1.917.001c-1.504 0-1.794.715-1.794 1.763v2.313h3.587l-.467 3.296h-3.12V24h6.116C23.404 24 24 23.404 24 22.674V1.326C24 .596 23.404 0 22.675 0z"/>
        </svg>
      </a>
    </div>
    <div class="footer-logo">Walid Jahin Art Studio</div>
    <div class="footer-bottom">© 2025 Walid Jahin. All rights reserved</div>
  </footer>

  <script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.4/dist/purify.min.js"></script>
  <script>
    window.gtranslateSettings = {
      default_language: "en",
      native_language_names: true,
      languages: ["en", "ar", "ko"],
      wrapper_selector: ".gtranslate_wrapper",
      flag_size: 24,
      switcher_horizontal_position: "inline"
    };

    const adminButton = document.getElementById('adminButton');
    function updateAdminButton() {
      const isAdmin = localStorage.getItem('isAdmin') === 'true';
      adminButton.textContent = isAdmin ? 'LOGOUT' : 'LOGIN';
      adminButton.onclick = () => {
        if (isAdmin) {
          localStorage.removeItem('isAdmin');
          location.reload();
        } else {
          location.href = '/admin/login';
        }
      };
    }

    document.addEventListener("DOMContentLoaded", async () => {
      updateAdminButton();

      const grid = document.getElementById("artwork-grid");
      const modal = document.getElementById("artwork-modal");
      const modalImg = document.getElementById("modal-image");
      const closeModal = document.getElementById("close-modal");

      try {
        const res = await fetch("/api/artwork");
        const data = await res.json();

        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "artwork-card";
          card.innerHTML = `
            <img src="/uploads/${DOMPurify.sanitize(item.imageUrl)}" alt="${DOMPurify.sanitize(item.title)}" />
            <h3>${DOMPurify.sanitize(item.title)}</h3>
            <p>₩${item.price.toLocaleString()}</p>
          `;
          card.addEventListener("click", () => {
            modalImg.src = `/uploads/${DOMPurify.sanitize(item.imageUrl)}`;
            modal.classList.remove("hidden");
          });
          grid.appendChild(card);
        });

        closeModal.addEventListener("click", () => {
          modal.classList.add("hidden");
        });
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.classList.add("hidden");
        });
      } catch (err) {
        console.error("Failed to load artworks", err);
      }
    });
  </script>
</body>
</html>
