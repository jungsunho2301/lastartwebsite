<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Walid Jahin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fff;
      color: #111;
    }


    .contact-section { max-width: 40rem; margin: 5rem auto; padding: 0 1.25rem; text-align: center; }
    .contact-section h2 { font-size: 1.75rem; font-weight: 700; }
    .contact-section p { font-size: .875rem; color: #555; margin-bottom: 2.5rem; }
    .contact-form input, .contact-form textarea { width: 100%; padding: .875rem; margin-bottom: 1rem; border: .0625rem solid #ccc; border-radius: .375rem; font-size: .875rem; font-family: 'Noto Sans KR', sans-serif; }
    .contact-form textarea { height: 10rem; resize: none; }
    .contact-form button { width: 100%; padding: .875rem; background-color: #111; color: #fff; border: none; font-size: .875rem; font-weight: bold; border-radius: .375rem; cursor: pointer; transition: background-color 0.3s; }
    .contact-form button:hover { background-color: #333; }

  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="nav-wrapper">
        <div class="logo">Walid Jahin</div>
        <div class="nav-links">
          <a th:href="@{/index}">HOME</a>
          <a th:href="@{/artist}">ARTIST</a>
          <a th:href="@{/artwork}">ART WORK</a>
          <a th:href="@{/artshop}">ART SHOP</a>
        </div>
      </div>
      <div class="lang">
        <div class="gtranslate_wrapper"></div>
        <button id="adminButton" style="background: #f9f9f9; color: black; border: none; padding: .375rem .875rem; border-radius: .25rem; cursor: pointer;">LOGIN</button>
      </div>
    </div>
  </header>

  <script>
    const adminButton = document.getElementById('adminButton');
    function updateAdminButton() {
      const isAdmin = localStorage.getItem('isAdmin') === 'true';
      adminButton.textContent = isAdmin ? 'LOGOUT' : 'LOGIN';
      adminButton.onclick = () => {
        if (isAdmin) {
          localStorage.removeItem('isAdmin');
          location.reload();
        } else {
          location.href = '/admin/login';
        }
      };
    }
    document.addEventListener('DOMContentLoaded', updateAdminButton);
  </script>

<section class="contact-section">
  <h2>Contact</h2>
  <p>Please inquire about the work you are interested in.</p>

  <form id="inquiryForm" class="contact-form">
    <input type="text" name="name" placeholder="Name" required />
    <input type="email" name="email" placeholder="Email address" required />
    <input type="text" name="artnum" placeholder="Work ID" required />
    <input type="text" name="phone" placeholder="Phone" required />
    <textarea name="message" placeholder="Please enter your inquiry details." required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<script>
  document.getElementById('inquiryForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);
    const json = Object.fromEntries(formData.entries());

    try {
      const res = await fetch('/api/inquiry', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(json)
      });

      const msg = await res.text();
      alert(msg);
    } catch (err) {
      alert(' Failed to send inquiry: ' + err.message);
    }
  });
</script>

  <script>
document.addEventListener('DOMContentLoaded', async () => {
  const igEl = document.getElementById('footerInstagram');
  const fbEl = document.getElementById('footerFacebook');

  try {
    const [igRes, fbRes] = await Promise.all([
      fetch('/api/social/instagram'),
      fetch('/api/social/facebook'),
    ]);

    const igUrl = igRes.ok ? (await igRes.text()).trim() : '';
    const fbUrl = fbRes.ok ? (await fbRes.text()).trim() : '';

    if (igEl) {
      if (igUrl) { igEl.href = igUrl; igEl.style.display = 'inline-flex'; }
      else igEl.style.display = 'none';
    }
    if (fbEl) {
      if (fbUrl) { fbEl.href = fbUrl; fbEl.style.display = 'inline-flex'; }
      else fbEl.style.display = 'none';
    }
  } catch (e) {
    console.error('SNS 링크 로드 실패:', e);
    if (igEl) igEl.style.display = 'none';
    if (fbEl) fbEl.style.display = 'none';
  }
});
</script>


  <footer>
    <nav>
      <a th:href="@{/index}">HOME</a>
      <a th:href="@{/privacy}">PRIVACY POLICY</a>
      <a th:href="@{/terms}">TERMS OF USE</a>
      <a th:href="@{/contact}">CONTACT</a>
    </nav>
<div class="footer-sns">
    <!-- 인스타 -->
    <a id="footerInstagram" href="#" target="_blank" rel="noopener" aria-label="Instagram" style="display:none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zM12 7a5 5 0 1 1 0 10a5 5 0 0 1 0-10zm0 1.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 0 0 0-7zm4.25-.75a.75.75 0 1 1 0 1.5a.75.75 0 0 1 0-1.5z"/>
        </svg>
    </a>

    <!-- 페이스북 -->
    <a id="footerFacebook" href="#" target="_blank" rel="noopener" aria-label="Facebook" style="display:none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <path d="M22.675 0h-21.35C.596 0 0 .596 0 1.326v21.348C0 23.404.596 24 1.326 24H12.82v-9.294H9.692V11.41h3.128V8.797c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.794.143v3.24l-1.917.001c-1.504 0-1.794.715-1.794 1.763v2.313h3.587l-.467 3.296h-3.12V24h6.116C23.404 24 24 23.404 24 22.674V1.326C24 .596 23.404 0 22.675 0z"/>
        </svg>
  </div>
</a>

    <div class="footer-logo">Walid Jahin Art Studio</div>
    <div class="footer-bottom">© 2025 Walid Jahin. All rights reserved</div>
  </footer>

  <script>
    window.gtranslateSettings = {
      "default_language": "en",
      "native_language_names": true,
      "languages": ["en", "ar", "ko"],
      "wrapper_selector": ".gtranslate_wrapper",
      "flag_size": 24,
      "switcher_horizontal_position": "inline"
    };
  </script>
  <script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.4/dist/purify.min.js"></script>
</body>
</html>
