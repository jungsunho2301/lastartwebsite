<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Shop - Walid Jahin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fff;
      color: #111;
    }

    header {
      background-color: #f9f9f9;
      padding: 32px 40px;
      border-bottom: 1px solid #e5e5e5;
      position: relative;
    }

    .header-inner {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }

    .nav-links a {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      color: #111;
      border: 1px solid #ccc;
      transition: background-color 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background-color: #f0f0f0;
    }

    .lang {
      position: absolute;
      right: 40px;
      top: 32px;
      font-size: 14px;
      color: #111;
      white-space: nowrap;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
      max-width: 1200px;
      margin: 80px auto;
      padding: 0 20px;
    }

    .product-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      background-color: #fff;
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: left;
      cursor: pointer;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .product-card img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .product-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .product-meta {
      font-size: 14px;
      color: #777;
      margin-bottom: 4px;
    }

    .product-price {
      font-size: 16px;
      color: #000;
    }

    footer {
      background-color: #191A1B;
      color: #fff;
      padding: 60px 20px 40px;
      text-align: center;
    }

    footer nav a {
      color: #ccc;
      margin: 0 12px;
      font-size: 14px;
      text-decoration: none;
    }

    footer nav a:hover {
      color: #fff;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 800;
      margin-top: 30px;
    }

    .footer-bottom {
      font-size: 12px;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="nav-wrapper">
        <div class="logo">Walid Jahin</div>
        <div class="nav-links">
          <a href="index.html">HOME</a>
          <a href="artist.html">ARTIST</a>
          <a href="artwork.html">ART WORK</a>
          <a href="artshop.html" class="active">ART SHOP</a>
        </div>
      </div>
      <div class="lang">ENG▼</div>
    </div>
  </header>

  <section class="product-grid">
    <button class="product-card" onclick="location.href='contact.html'">
      <img src="assets/images/art1.jpg" alt="작품 이미지" />
      <div class="product-title">제목을 입력해주세요</div>
      <div class="product-meta">WALID JAHIN</div>
      <div class="product-price">₩ 300,000</div>
    </button>
    <!-- 반복 가능 -->
  </section>

  <footer>
    <nav>
      <a href="index.html">HOME</a>
      <a href="privacy.html">PRIVACY POLICY</a>
      <a href="terms.html">TERMS OF USE</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <div class="footer-logo">Walid Jahin Art Studio</div>
    <div class="footer-bottom">© 2025 Walid Jahin. All rights reserved</div>
  </footer>
</body>
</html>
