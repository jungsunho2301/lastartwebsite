spring:
  application:
    name: jahin
  datasource:
    url: jdbc:mysql://localhost:3306/walid_db?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace

app:
  upload:
    artshop-dir: uploads/artshop/
    artwork-dir: uploads/artwork/

recaptcha:
  secret: ${RECAPTCHA_SECRET}

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: Lax
        secure: false
