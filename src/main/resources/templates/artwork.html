<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art Work - Walid Jahin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    body {
      margin: 0;
      font-family: 'Noto Sans KR', serif;
      background-color: #fff;
      color: #111;
    }


    .artwork-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4개 고정 */
      gap: 1.875rem;
      padding: 2.5rem;
      max-width: 56.25rem;       /* 👈 최대 너비 제한 */
      margin: 0 auto;         /* 👈 가운데 정렬 */
    }
    @media (max-width: 64rem) {
      .artwork-container {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    @media (max-width: 48rem) {
      .artwork-container {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (max-width: 30rem) {
      .artwork-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .artwork-card {
      border: .0625rem solid #eee;
      padding: .75rem;
      text-align: center;
      transition: box-shadow 0.3s;
      cursor: pointer;
    }
    .artwork-card:hover {
      box-shadow: 0 .25rem 1rem rgba(0,0,0,0.1);
    }
    .artwork-card img {
      max-width: 100%;
      height: 12.5rem;
      object-fit: cover;
      border-radius: .5rem;
    }
#artwork-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
}

.modal-backdrop {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.8);
}

.modal-content {
  position: relative;
  max-width: 30vw;
  max-height: 40vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ✅ 이미지 + ID 라벨을 감싸는 래퍼 */
.image-wrapper {
  position: relative;
  display: inline-block;
  max-width: 100%;
  max-height: 100%;
}

.image-wrapper img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.id-label {
  position: absolute;
  background: rgba(255, 255, 255, 0.95);
  color: #333;
  font-size: .9375rem;
  padding: .375rem .75rem;
  border-radius: .375rem;
  font-weight: bold;
  box-shadow: 0 .125rem .375rem rgba(0, 0, 0, 0.25);
  z-index: 10;

  /* ✅ 새로 추가된 핵심 속성 */
  white-space: nowrap;
  min-width: 3.75rem;
  text-align: center;
}




    .close {
      position: fixed;
      top: -2.5rem;
      right: -2.5rem;
      font-size: 2.25rem;
      color: white;
      cursor: pointer;
      z-index: 10001;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

    <header>
    <div class="header-inner">
      <div class="nav-wrapper">
        <div class="logo">Walid Jahin</div>
        <div class="nav-links">
          <a th:href="@{/index}">HOME</a>
          <a th:href="@{/artist}">ARTIST</a>
          <a th:href="@{/artwork}">ART WORK</a>
          <a th:href="@{/artshop}">ART SHOP</a>
        </div>
      </div>
      <div class="lang">
        <div class="gtranslate_wrapper"></div>
        <button id="adminButton" style="background: #f9f9f9; color: black; border: none; padding: .375rem .875rem; border-radius: .25rem; cursor: pointer;">LOGIN</button>
      </div>
    </div>
  </header>

  <section class="text-center py-16">
    <h2 class="text-4xl font-serif font-semibold mb-2">WALID JAHIN</h2>
    <h2 class="text-3xl font-serif mb-4">ART WORK</h2>
  </section>

  <section id="artwork-grid" class="artwork-container"></section>

  <div id="artwork-modal" class="hidden">
    <div class="modal-backdrop">
      <div class="modal-content">
        <span id="modal-id-label" class="id-label">Artwork ID</span>
        <span id="close-modal" class="close">&times;</span>
        <img id="modal-image" src="" alt="Artwork Image" />
      </div>
    </div>
  </div>





  <script>
    window.gtranslateSettings = {
      default_language: "en",
      native_language_names: true,
      languages: ["en", "ar", "ko"],
      wrapper_selector: ".gtranslate_wrapper",
      flag_size: 24,
      switcher_horizontal_position: "inline"
    };

    const adminButton = document.getElementById('adminButton');
    function updateAdminButton() {
      const isAdmin = localStorage.getItem('isAdmin') === 'true';
      adminButton.textContent = isAdmin ? 'LOGOUT' : 'LOGIN';
      adminButton.onclick = () => {
        if (isAdmin) {
          localStorage.removeItem('isAdmin');
          location.reload();
        } else {
          location.href = '/admin/login';
        }
      };
    }

document.addEventListener("DOMContentLoaded", async () => {
  updateAdminButton();

  const grid = document.getElementById("artwork-grid");
  const modal = document.getElementById("artwork-modal");
  const modalImg = document.getElementById("modal-image");
  const modalIdLabel = document.getElementById("modal-id-label");
  const closeModal = document.getElementById("close-modal");

  try {
    const res = await fetch("/api/artwork");
    const data = await res.json();
    const artworks = data.content ?? data;

    artworks.forEach(item => {
      const card = document.createElement("div");
      card.className = "artwork-card";
      card.innerHTML = `
        <img src="${DOMPurify.sanitize(item.imagePath)}" alt="Artwork ${DOMPurify.sanitize(item.id)}" />
      `;

      card.addEventListener("click", () => {
        const imgPath = DOMPurify.sanitize(item.imagePath);
        const artworkId = DOMPurify.sanitize(item.id);

        if (imgPath) {
          modalImg.src = imgPath;
          modal.style.display = "flex";

          // 이미지 로드 완료 후 ID 표시 + 위치 계산
          modalImg.onload = () => {
            modalIdLabel.textContent = `ID: ${artworkId}`;

            const imgRect = modalImg.getBoundingClientRect();
            const wrapperRect = modalImg.parentElement.getBoundingClientRect();

            const offsetX = 12; // 바깥으로 오른쪽 이동
            const offsetY = 0;  // 위쪽은 정확히 맞춰서 0rem

            // 이미지 우상단 바깥에 정확히 붙이기
            modalIdLabel.style.position = "absolute";
            modalIdLabel.style.top = `${imgRect.top - wrapperRect.top + offsetY}px`;
            modalIdLabel.style.left = `${imgRect.right - wrapperRect.left + offsetX}px`;
          };
        }
      });

      grid.appendChild(card);
    });

    closeModal.addEventListener("click", () => {
      modal.style.display = "none";
    });

    modal.addEventListener("click", (e) => {
      if (!document.querySelector(".modal-content").contains(e.target)) {
        modal.style.display = "none";
      }
    });

  } catch (err) {
    console.error("🎯 작품 로딩 실패:", err);
  }
});




  </script>




  <footer>
    <nav>
      <a th:href="@{/index}">HOME</a>
      <a th:href="@{/privacy}">PRIVACY POLICY</a>
      <a th:href="@{/terms}">TERMS OF USE</a>
      <a th:href="@{/contact}">CONTACT</a>
    </nav>
    <div class="sns-icon flex justify-center gap-4 mt-4">
      <a href="https://www.instagram.com/YOUR_INSTAGRAM_ID" target="_blank" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zM12 7a5 5 0 1 1 0 10a5 5 0 0 1 0-10zm0 1.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 0 0 0-7zm4.25-.75a.75.75 0 1 1 0 1.5a.75.75 0 0 1 0-1.5z"/>
        </svg>
      </a>
      <a href="https://www.facebook.com/YOUR_FACEBOOK_ID" target="_blank" aria-label="Facebook">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <path d="M22.675 0h-21.35C.596 0 0 .596 0 1.326v21.348C0 23.404.596 24 1.326 24H12.82v-9.294H9.692V11.41h3.128V8.797c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.794.143v3.24l-1.917.001c-1.504 0-1.794.715-1.794 1.763v2.313h3.587l-.467 3.296h-3.12V24h6.116C23.404 24 24 23.404 24 22.674V1.326C24 .596 23.404 0 22.675 0z"/>
        </svg>
      </a>
    </div>
    <div class="footer-logo">Walid Jahin Art Studio</div>
    <div class="footer-bottom">© 2025 Walid Jahin. All rights reserved</div>
  </footer>

  <script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.4/dist/purify.min.js"></script>

</body>
</html>
