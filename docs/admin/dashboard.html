<!-- 관리자 대시보드 - 수정 반영된 전체 코드 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walid Jahin Art Studio</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fff;
      color: #111;
    }

    header {
      background-color: #f9f9f9;
      padding: 32px 40px;
      border-bottom: 1px solid #e5e5e5;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }

    .nav-links a {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      color: #111;
      border: 1px solid #ccc;
      transition: background-color 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background-color: #f0f0f0;
    }

    .lang {
      font-size: 14px;
      color: #111;
      white-space: nowrap;
    }

    .dashboard {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
    }
    .dashboard h2 {
      margin-bottom: 1.5rem;
    }
    .upload-section {
      background: #f4f4f4;
      padding: 1.5rem;
      border-radius: 6px;
      margin-bottom: 2rem;
    }
    .upload-section label,
    .upload-section input,
    .upload-section textarea,
    .upload-section select,
    .upload-section button {
      display: block;
      width: 100%;
      margin-bottom: 1rem;
    }
    .upload-section input,
    .upload-section textarea,
    .upload-section select {
      padding: 0.5rem;
      border: 1px solid #aaa;
      border-radius: 4px;
    }
    .upload-section button {
      padding: 0.5rem 1rem;
      background: black;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="nav-wrapper">
        <div class="logo">Walid Jahin</div>
        <div class="nav-links">
          <a href="index.html">HOME</a>
          <a href="artist.html">ARTIST</a>
          <a href="artwork.html">ART WORK</a>
          <a href="artshop.html">ART SHOP</a>
        </div>
      </div>
      <div class="lang">
        ENG▼
        <button id="adminButton" style="margin-left: 20px; background: black; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer;">LOGIN</button>
      </div>
    </div>
  </header>

  <div class="dashboard">

    <section class="upload-section">
      <h3>Update Artist Email</h3>
      <form id="emailForm">
        <label for="newEmail">New Email Address</label>
        <input type="email" id="newEmail" required />
        <button type="submit">Update Email</button>
      </form>
    </section>

    <section class="upload-section">
      <h3>Instagram Connection</h3>
      <form id="instagramForm">
        <label for="instagramUrl">Instagram URL</label>
        <input type="url" id="instagramUrl" required />
        <button type="submit">Connect</button>
      </form>
    </section>

    <section class="upload-section">
      <h3>Facebook Connection</h3>
      <form id="facebookForm">
        <label for="facebookUrl">Facebook URL</label>
        <input type="url" id="facebookUrl" required />
        <button type="submit">Connect</button>
      </form>
    </section>

    <section class="upload-section">
      <h3>Send Newsletter</h3>
      <form id="newsletterForm">
        <label for="newsletterTitle">Newsletter Title</label>
        <input type="text" id="newsletterTitle" required />
        <label for="newsletterContent">Newsletter Content</label>
        <textarea id="newsletterContent" rows="5" required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
    <h2>Admin Dashboard</h2>

    <section class="upload-section">
      <h3>Upload New Artwork</h3>
      <form id="artworkForm" enctype="multipart/form-data">
        <label for="image">Artwork Image</label>
        <input type="file" id="image" name="image" accept="image/*" required />
        <button type="submit">Upload</button>
      </form>
      <h4>Update / Delete Artwork</h4>
      <input type="text" id="artworkId" placeholder="Artwork ID" />
      <div class="button-group">
        <button onclick="fetchArtwork()">조회하기</button>
        <button onclick="deleteArtwork()">Delete</button>
        <button onclick="updateArtwork()">Update</button>
      </div>
    </section>

    <section class="upload-section">
      <h3>Edit Artist Page Text</h3>
      <form id="artistTextForm">
        <label for="artistTextId">Text ID</label>
        <input type="text" id="artistTextId" required />
        <label for="artistTextContent">Content</label>
        <textarea id="artistTextContent" rows="4" required></textarea>
        <div class="button-group">
          <button type="submit">Update</button>
          <button type="button" onclick="deleteArtistText()">Delete</button>
        </div>
      </form>
    </section>

    <section class="upload-section">
      <h3>Upload New Artshop Item</h3>
      <form id="artshopForm" enctype="multipart/form-data">
        <label for="productName">Product Name</label>
        <input type="text" id="productName" name="productName" required />
        <label for="price">Price</label>
        <input type="number" id="price" name="price" required />
        <label for="productImage">Product Image</label>
        <input type="file" id="productImage" name="productImage" accept="image/*" required />
        <button type="submit">Upload</button>
      </form>
    </section>

    <section class="upload-section">
      <h3>Update / Delete Artshop Item</h3>
      <input type="text" id="artshopId" placeholder="Artshop Item ID" />
      <div class="button-group">
        <button onclick="fetchArtshop()">조회하기</button>
        <button onclick="deleteArtshop()">Delete</button>
        <button onclick="updateArtshop()">Update</button>
      </div>
    </section>
  </div>

  <script>
    const adminButton = document.getElementById('adminButton');
    function updateAdminButton() {
      const isAdmin = localStorage.getItem('isAdmin') === 'true';
      adminButton.textContent = isAdmin ? 'LOGOUT' : 'LOGIN';
      adminButton.onclick = () => {
        if (isAdmin) {
          localStorage.removeItem('isAdmin');
          location.reload();
        } else {
          location.href = '/docs/admin/login.html';
        }
      };
    }
    document.addEventListener('DOMContentLoaded', updateAdminButton);

    document.getElementById("artworkForm").addEventListener("submit", async e => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch("/admin/api/artwork/upload", {
        method: "POST",
        body: formData
      });
      alert(await res.text());
    });

    document.getElementById("artshopForm").addEventListener("submit", async e => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch("/admin/api/artshop/upload", {
        method: "POST",
        body: formData
      });
      alert(await res.text());
    });

    document.getElementById("emailForm").addEventListener("submit", async e => {
      e.preventDefault();
      const res = await fetch("/admin/api/email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("newEmail").value })
      });
      alert(await res.text());
    });

    document.getElementById("instagramForm").addEventListener("submit", async e => {
      e.preventDefault();
      const res = await fetch("/admin/api/social/instagram", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: document.getElementById("instagramUrl").value })
      });
      alert(await res.text());
    });

    document.getElementById("facebookForm").addEventListener("submit", async e => {
      e.preventDefault();
      const res = await fetch("/admin/api/social/facebook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: document.getElementById("facebookUrl").value })
      });
      alert(await res.text());
    });

    document.getElementById("newsletterForm").addEventListener("submit", async e => {
      e.preventDefault();
      const res = await fetch("/admin/api/news/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: document.getElementById("newsletterTitle").value,
          content: document.getElementById("newsletterContent").value
        })
      });
      alert(await res.text());
    });
      alert(await res.text());
    });

    async function fetchArtwork() {
      const id = document.getElementById("artworkId").value;
      const res = await fetch(`/admin/api/artwork/${id}`);
      const data = await res.json();
      alert(`Artwork Info\nID: ${id}\nTitle: ${data.title || 'N/A'}`);
    }

    async function deleteArtwork() {
      const id = document.getElementById("artworkId").value;
      const res = await fetch(`/admin/api/artwork/${id}`, { method: "DELETE" });
      alert(await res.text());
    }

    async function updateArtwork() {
      const id = document.getElementById("artworkId").value;
      const formData = new FormData(document.getElementById("artworkForm"));
      const res = await fetch(`/admin/api/artwork/${id}`, {
        method: "PUT",
        body: formData
      });
      alert(await res.text());
    }

    async function fetchArtshop() {
      const id = document.getElementById("artshopId").value;
      const res = await fetch(`/admin/api/artshop/${id}`);
      const data = await res.json();
      alert(`Artshop Info\nID: ${id}\nName: ${data.productName || 'N/A'}\nPrice: ${data.price || 'N/A'}`);
    }

    async function deleteArtshop() {
      const id = document.getElementById("artshopId").value;
      const res = await fetch(`/admin/api/artshop/${id}`, { method: "DELETE" });
      alert(await res.text());
    }

    async function updateArtshop() {
      const id = document.getElementById("artshopId").value;
      const formData = new FormData(document.getElementById("artshopForm"));
      const res = await fetch(`/admin/api/artshop/${id}`, {
        method: "PUT",
        body: formData
      });
      alert(await res.text());
    }

    document.getElementById("artistTextForm").addEventListener("submit", async e => {
      e.preventDefault();
      const id = document.getElementById("artistTextId").value;
      const content = document.getElementById("artistTextContent").value;
      const res = await fetch(`/admin/api/artist-text/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content })
      });
      alert(await res.text());
    });

    async function deleteArtistText() {
      const id = document.getElementById("artistTextId").value;
      const res = await fetch(`/admin/api/artist-text/${id}`, { method: "DELETE" });
      alert(await res.text());
    }
  </script>
</body>
</html>
