<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | Walid Jahin</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 2rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-container input {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #aaa;
      border-radius: 4px;
    }
    .login-container button {
      width: 100%;
      padding: 0.6rem;
      background: black;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .error {
      color: red;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Log In</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <!-- ✅ CSRF 토큰을 meta에 삽입 -->
  <script>
    async function setCsrfMetaTag() {
      try {
        const res = await fetch('/api/csrf-token', { credentials: 'include' });
        const token = await res.json();
        const meta = document.createElement('meta');
        meta.name = '_csrf';
        meta.content = token.token;
        document.head.appendChild(meta);
      } catch (err) {
        console.error('CSRF 토큰 로드 실패:', err);
      }
    }

    setCsrfMetaTag();
  </script>

  <!-- ✅ 로그인 스크립트 -->
  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-XSRF-TOKEN': csrfToken
          },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          window.location.href = 'dashboard.html';
        } else {
          let message = 'Login failed. Please try again.';
          try {
            const data = await res.json();
            message = data.message || message;
          } catch {
            const text = await res.text();
            message = text || message;
          }
          errorMsg.innerHTML = DOMPurify.sanitize(message);
        }
      } catch (error) {
        errorMsg.innerHTML = DOMPurify.sanitize('Server error. Please try again later.');
      }
    });

    // ✅ 이미 로그인된 경우 자동 리디렉션
    document.addEventListener("DOMContentLoaded", async () => {
      const res = await fetch("/api/admin/check-session", { credentials: "include" });
      if (res.ok) {
        window.location.href = "dashboard.html";
      }
    });
  </script>

  <!-- DOMPurify -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.4/dist/purify.min.js"></script>
</body>
</html>
