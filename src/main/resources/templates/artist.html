<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist - Walid Jahin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    body {
      margin: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fff;
      color: #111;
    }

header {
  background-color: #f9f9f9;
  padding: 40px 40px; /* 상하 여백을 늘림 */
  border-bottom: 1px solid #e5e5e5;
  position: relative;
  height: 160px; /* 명시적 높이 확보 */
}

    .header-inner {
      display: flex;
      justify-content: center;
      align-items: center;
    }

.nav-wrapper {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
}


    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }

    .nav-links a {
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      color: #111;
      border: 1px solid #ccc;
      transition: background-color 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background-color: #f0f0f0;
    }

    .lang {
      position: absolute;
      right: 40px;
      top: 32px;
      font-size: 14px;
      color: #111;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang button {
      background: black;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    footer { background-color: #191A1B; color: #fff; padding: 60px 20px 40px; text-align: center; }
    footer nav a { color: #ccc; margin: 0 12px; font-size: 14px; text-decoration: none; }
    footer nav a:hover { color: #fff; }
    .footer-logo { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 800; margin-top: 30px; }
    .footer-bottom { font-size: 12px; color: #888; margin-top: 20px; }
    .sns-icon svg {
      margin-top: 20px;
      transition: fill 0.3s;
    }
    .sns-icon svg:hover {
      fill: #fff;
    }
    .sns-icon a:first-child svg { fill: #000; } /* Instagram - black */
    .sns-icon a:last-child svg { fill: #000; }  /* Facebook - black */
        .artwork-intro {
      text-align: center;
      padding: 60px 20px 20px;
    }

    .artwork-intro h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
    }

    .artwork-intro p {
      margin-top: 10px;
      font-size: 16px;
      color: #555;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px 40px 60px;
    }

    .art-img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

  </style>
</head>
<body class="bg-white text-gray-900 font-sans">
  <header>
    <div class="header-inner">
      <div class="nav-wrapper">
        <div class="logo">Walid Jahin</div>
        <div class="nav-links">
          <a th:href="@{/index}">HOME</a>
          <a th:href="@{/artist}">ARTIST</a>
          <a th:href="@{/artwork}">ART WORK</a>
          <a th:href="@{/artshop}">ART SHOP</a>
        </div>
      </div>
      <div class="lang">
        <div class="gtranslate_wrapper"></div>
        <button id="adminButton" style="background: #f9f9f9; color: black; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer;">LOGIN</button>
      </div>
    </div>
  </header>

  <script>
    const adminButton = document.getElementById('adminButton');
    function updateAdminButton() {
      const isAdmin = localStorage.getItem('isAdmin') === 'true';
      adminButton.textContent = isAdmin ? 'LOGOUT' : 'LOGIN';
      adminButton.onclick = () => {
        if (isAdmin) {
          localStorage.removeItem('isAdmin');
          location.reload();
        } else {
          location.href = '/admin/login';
        }
      };
    }
    document.addEventListener('DOMContentLoaded', updateAdminButton);
  </script>

<body>
  <!-- Bio Section -->
  <section class="w-full py-16 text-center">
    <h2 class="text-4xl font-serif font-semibold mb-2">WALID JAHIN</h2>
    <p id="artist-born" class="text-gray-600"></p>
    <p id="artist-bio" class="text-gray-600 mt-2 text-sm px-4 max-w-3xl mx-auto"></p>
  </section>

  <!-- Gallery Row -->
  <section class="w-full py-10">
    <div id="artist-gallery" class="max-w-6xl mx-auto px-4 grid grid-cols-2 md:grid-cols-6 gap-4">
      <!-- JS로 이미지 삽입 -->
    </div>
  </section>

  <!-- Major Work Slider -->
  <section class="text-center py-12">
    <h3 class="text-3xl font-serif mb-6">Major Work</h3>
    <div id="major-work" class="max-w-4xl mx-auto grid grid-cols-4 gap-4">
      <!-- JS로 이미지 삽입 -->
    </div>
  </section>

  <!-- Exhibition Sections -->
  <section id="exhibition-section" class="max-w-4xl mx-auto px-4 py-12 space-y-10">
    <!-- JS로 데이터 삽입 -->
  </section>

   <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.4/dist/purify.min.js"></script>
  <script>
    async function loadArtistContent() {
      try {
        const bio = await fetch('/api/artist/section/bio').then(r => r.json());
        const born = await fetch('/api/artist/section/born').then(r => r.json());
        document.getElementById('artist-born').innerText = DOMPurify.sanitize(born.content || '');
        document.getElementById('artist-bio').innerText = DOMPurify.sanitize(bio.content || '');

        const gallery = await fetch('/api/artist/gallery').then(r => r.json());
        const galleryContainer = document.getElementById('artist-gallery');
        galleryContainer.innerHTML = '';
        gallery.forEach(img => {
          const el = document.createElement('img');
          el.src = '/uploads/' + DOMPurify.sanitize(img);
          el.className = 'rounded shadow';
          galleryContainer.appendChild(el);
        });

        const major = await fetch('/api/artist/major').then(r => r.json());
        const majorContainer = document.getElementById('major-work');
        majorContainer.innerHTML = '';
        major.forEach(img => {
          const el = document.createElement('img');
          el.src = '/uploads/' + DOMPurify.sanitize(img);
          el.className = 'rounded';
          majorContainer.appendChild(el);
        });

        const exhibitions = await fetch('/api/artist/exhibition').then(r => r.json());
        const section = document.getElementById('exhibition-section');
        section.innerHTML = '';
        exhibitions.forEach(ex => {
          const div = document.createElement('div');
          div.innerHTML = `
            <h4 class="font-serif text-xl mb-2">${DOMPurify.sanitize(ex.title)}</h4>
            <p class="text-sm text-gray-600">${DOMPurify.sanitize(ex.content)}</p>
          `;
          section.appendChild(div);
        });
      } catch (e) {
        console.error('❌ Artist Load Error:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadArtistContent);
  </script>


  <footer>
    <nav>
      <a th:href="@{/index}">HOME</a>
      <a th:href="@{/privacy}">PRIVACY POLICY</a>
      <a th:href="@{/terms}">TERMS OF USE</a>
      <a th:href="@{/contact}">CONTACT</a>
    </nav>
    <div class="sns-icon flex justify-center gap-4 mt-4">
      <a href="https://www.instagram.com/YOUR_INSTAGRAM_ID" target="_blank" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5a4.25 4.25 0 0 0 4.25-4.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zM12 7a5 5 0 1 1 0 10a5 5 0 0 1 0-10zm0 1.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 0 0 0-7zm4.25-.75a.75.75 0 1 1 0 1.5a.75.75 0 0 1 0-1.5z"/>
        </svg>
      </a>
      <a href="https://www.facebook.com/YOUR_FACEBOOK_ID" target="_blank" aria-label="Facebook">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <path d="M22.675 0h-21.35C.596 0 0 .596 0 1.326v21.348C0 23.404.596 24 1.326 24H12.82v-9.294H9.692V11.41h3.128V8.797c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.794.143v3.24l-1.917.001c-1.504 0-1.794.715-1.794 1.763v2.313h3.587l-.467 3.296h-3.12V24h6.116C23.404 24 24 23.404 24 22.674V1.326C24 .596 23.404 0 22.675 0z"/>
        </svg>
      </a>
    </div>
    <div class="footer-logo">Walid Jahin Art Studio</div>
    <div class="footer-bottom">© 2025 Walid Jahin. All rights reserved</div>
  </footer>

  <script>
    window.gtranslateSettings = {
      "default_language": "en",
      "native_language_names": true,
      "languages": ["en", "ar", "ko"],
      "wrapper_selector": ".gtranslate_wrapper",
      "flag_size": 24,
      "switcher_horizontal_position": "inline"
    };
  </script>
  <script src="https://cdn.gtranslate.net/widgets/latest/dwf.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.4/dist/purify.min.js"></script>
</body>
</html>
